name: Witness sender scheduling experiment

on:
  pull_request:
  workflow_dispatch:

jobs:
  witness-sender:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install libsodium
        run: brew install libsodium
      - name: Set up Python 3.12.2
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.12.2
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest hio
          pip install -r requirements.txt
      - name: Configure libsodium path
        run: echo "DYLD_FALLBACK_LIBRARY_PATH=$(brew --prefix libsodium)/lib" >> "$GITHUB_ENV"
      - name: Run witness sender experiment
        run: /usr/bin/time -p python -m pytest -q tests/app/test_agenting.py::test_witness_sender
